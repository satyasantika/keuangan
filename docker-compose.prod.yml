# Compose produksi Keuangan FKIP Unsil (Profil Ringan: STANDAR-TEKNIS §1b dan §7).
# Pakai: cp .env.production.example .env.production && isi; lalu
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Variabel lingkungan (container & interpolasi compose) dari .env.production (TIDAK di-commit).
# MariaDB berjalan NATIVE di host (DB_HOST=host.docker.internal). Compose ini TIDAK memuat container database,
# Redis, maupun Horizon; antrean, cache, sesi, dan lock memakai database, worker dinyalakan penjadwal.
name: keuangan

# Log Docker dirotasi (STANDAR-TEKNIS §7.1).
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-aplikasi: &aplikasi
  image: keuangan-app:${APP_VERSION:-latest}
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
    args:
      ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/keuangan}
  env_file: .env.production
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]
  logging: *log
  volumes:
    - tmp:/var/www/html/storage/app/tmp
    - logs:/var/www/html/storage/logs
  networks: [keuangan]

services:
  php:
    <<: *aplikasi
    mem_limit: 512m
    environment:
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: keuangan-web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/keuangan}
    restart: unless-stopped
    mem_limit: 64m
    logging: *log
    ports:
      - "${WEB_PORT:-8035}:80"
    depends_on:
      - php
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [keuangan]

  # Penjadwal sekaligus pemicu worker antrean (routes/console.php: queue:work tiap menit, --stop-when-empty).
  # Worker berjalan sebagai subproses di container ini: batas memori mencakup worker default (--memory=256)
  # dan worker berat (--memory=512). Nilai awal; wajib dibuktikan dengan `docker stats` (STANDAR-TEKNIS §7.1).
  scheduler:
    <<: *aplikasi
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 768m
    stop_grace_period: 60s

  # Cadangan harian 01:30 WIB: hanya KLIEN dump (mariadb-dump) ke basis data host, bukan server basis data.
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: keuangan-backup:${APP_VERSION:-latest}
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 128m
    logging: *log
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-db_keuangan}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME wajib diisi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      BACKUP_DIR: /backup/mysql
      RETENSI_HARI: ${RETENSI_HARI:-30}
    volumes:
      - ./backup:/backup
    networks: [keuangan]

volumes:
  tmp:
  logs:

networks:
  keuangan:
