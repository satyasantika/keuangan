# Nginx produksi Keuangan FKIP Unsil. Reverse proxy depan memotong awalan /keuangan dan mengirim
# X-Forwarded-Prefix /keuangan (lihat docs/deploy.md).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;
    charset utf-8;

    # Hanya impor Excel/CSV (≤ 10 MB); tidak ada unggahan bukti.
    client_max_body_size 10M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Blokir dotfiles (.env, .git, …) kecuali .well-known.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Aset hasil build bernama-hash: cache panjang.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(css|js|fonts)/filament/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Halaman eror statis saat PHP-FPM tidak dapat dijangkau (tema sama dengan halaman eror aplikasi).
    error_page 502 503 504 /galat/layanan.html;
    error_page 413 /galat/terlalu-besar.html;
    location ^~ /galat/ {
        internal;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }
}
