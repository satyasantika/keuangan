# Menjalankan seluruh uji sebelum penggelaran diizinkan.
#
# Keuangan FKIP menguji di atas MariaDB 10.11 (sama dengan server), bukan SQLite
# (service container sementara; produksi memakai MariaDB native di host), tanpa Redis. Gerbang: pint, phpstan, pest.
name: Uji keuangan
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

jobs:
  uji:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: db_keuangan_testing
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    # Variabel proses mengalahkan nilai di .env dan phpunit.xml.
    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: db_keuangan_testing
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, bcmath, gd, zip, pdo_mysql, exif, pcntl
          coverage: none

      - name: Siapkan Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Pasang dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: |
          cp .env.example .env
          sed -i 's/^SEED_ADMIN_PASSWORD=.*/SEED_ADMIN_PASSWORD=UjiSuperAdmin123/' .env
          php artisan key:generate

      - name: Bangun aset frontend
        run: |
          npm ci
          npm run build

      - name: Shellcheck skrip docker & cadangan
        run: shellcheck docker/entrypoint.sh docker/backup/*.sh scripts/*.sh

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pest
        run: php artisan test --parallel
